name: Scheduled Go + Next.js Task

on:
  schedule:
    # ตั้งเวลาแบบ Cron (เวลาเป็น UTC เสมอ)
    # เช่น '0 19 * * *' คือ 19:00 UTC = 02:00 น. ตามเวลาไทย (UTC+7)
    - cron: '0 19 * * *'
  workflow_dispatch: # อนุญาตให้กดสั่งรันด้วยมือ (Manual trigger) จากหน้า GitHub ได้ด้วย

jobs:
  run-scheduled-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: erp-api-v2/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: erp-web-v2/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: erp-web-v2
        run: npm ci

      - name: Run Backend Batch / Command
        working-directory: erp-api-v2
        env:
          # ส่งค่า Config ผ่าน GitHub Repository Secrets (ห้าม Hardcode)
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          APP_ENV: production
        run: |
          go run cmd/cron/main.go
